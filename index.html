<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Fanra</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
      animation: fadeIn 0.8s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      margin-bottom: 1rem;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
      background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: clamp(1rem, 3vw, 1.5rem);
      opacity: 0.9;
      margin-bottom: 2rem;
      font-weight: 300;
    }
    .badge {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      margin: 0.5rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.3); }
      50% { box-shadow: 0 0 20px 5px rgba(255,255,255,0.1); }
    }
    .info {
      margin-top: 3rem;
      padding: 1.5rem;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .info h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .info p { font-size: 0.9rem; opacity: 0.8; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 2rem;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
    .btn:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello Fanra 👋</h1>
    <p class="subtitle">Autonomous coding test project</p>
    
    <div>
      <span class="badge">Python + HTML</span>
      <span class="badge">Zero Dependencies</span>
      <span class="badge">Auto-tested</span>
    </div>

    <div class="info">
      <h3>📋 Project Info</h3>
      <p>Dibuat untuk menguji kemampuan <strong>autonomous coding</strong> — inspeksi workspace, buat file, jalankan test, perbaiki error, validasi ulang.</p>
      <button class="btn" onclick="celebrate()">Celebrate! 🎉</button>
    </div>
  </div>

  <script>
    function celebrate() {
      const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#ff8b94'];
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement('div');
        confetti.style.cssText = `
          position: fixed; width: 10px; height: 10px;
          background: ${colors[Math.floor(Math.random() * colors.length)]};
          left: ${Math.random() * 100}vw; top: -10px;
          border-radius: 50%; pointer-events: none; z-index: 9999;
          animation: fall ${2 + Math.random() * 2}s linear forwards;
        `;
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
      }
      const style = document.createElement('style');
      style.textContent = `@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }`;
      document.head.appendChild(style);
    }
    // Auto celebrate on load
    setTimeout(celebrate, 1000);
  </script>
</body>
</html>
